<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Nombre · KUBO</title>
  <meta name="description" content="KUBO: una forma más tranquila de organizar tu dinero.">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="u-skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <a class="site-header__brand" href="index.html">¿Cómo quieres llamarte?</a>
  </header>
  
  <main id="main" class="o-container o-stack">
    <h1>Nombre</h1>
    <form class="o-stack" action="#" method="post">
      <p class="text text--body">Bienvenido a KUBO</p>
      <div class="field"><label class="field__label" for="nombre">Tu nombre</label><input class="input" id="nombre" name="nombre" type="text" autocomplete="given-name"></div>
      <p class="text text--caption">Este nombre aparecerá en tu panel.</p>
      <button class="button" type="submit">Empezar</button>
    </form>
  </main>
</body>
</html>
