<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Iniciar sesión · KUBO</title>
  <meta name="description" content="KUBO: una forma más tranquila de organizar tu dinero.">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="u-skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <a class="site-header__brand" href="index.html">Iniciar sesión</a>
  </header>
  
  <main id="main" class="o-container o-stack">
    <h1>Acceso</h1>
    <form class="o-stack" action="#" method="post">
      <div class="field"><label class="field__label" for="email">Correo electronico</label><input class="input" id="email" name="email" type="email" autocomplete="email"></div>
      <div class="field"><label class="field__label" for="password">Contraseña</label><input class="input" id="password" name="password" type="password" autocomplete="current-password"></div>
      <label class="choice"><input class="choice__control" type="checkbox" name="recordar"> Recuérdame</label>
      <p><a class="link" href="#">¿Has olvidado tu contraseña?</a></p>
      <button class="button" type="submit">Iniciar sesión</button>
      <p class="text text--caption">o</p>
      <button class="button button--secondary" type="button">Continuar con Google</button>
      <button class="button button--secondary" type="button">Continuar con Apple</button>
      <p><a class="link" href="registrarse.html">¿Ya tienes cuenta? Iniciar sesión</a></p>
    </form>
  </main>
</body>
</html>
