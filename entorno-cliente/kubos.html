<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kubos · KUBO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-inicio-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.2 10.6 12 4.4l7.8 6.2v8.4a1.6 1.6 0 0 1-1.6 1.6H5.8a1.6 1.6 0 0 1-1.6-1.6z"/>
      <path d="M9.8 20.6v-3.2a2.2 2.2 0 0 1 4.4 0v3.2"/>
    </symbol>
    <symbol id="i-inicio-lleno" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M4.2 10.6 12 4.4l7.8 6.2v8.4a1.6 1.6 0 0 1-1.6 1.6H5.8a1.6 1.6 0 0 1-1.6-1.6zM9.8 20.6v-3.2a2.2 2.2 0 0 1 4.4 0v3.2z"/>
    </symbol>
    <symbol id="i-kubos-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(-28 11 12)">
        <rect x="5" y="6.5" width="12" height="11.5" rx="3.2"/>
        <path d="M5.8 13.4 11.6 7"/>
      </g>
      <circle cx="17.6" cy="16.8" r="2.8"/>
    </symbol>
    <symbol id="i-kubos-lleno" viewBox="0 0 24 24">
      <g transform="rotate(-28 11 12)">
        <rect x="5" y="6.5" width="12" height="11.5" rx="3.2" fill="currentColor" stroke="none"/>
        <path d="M5.8 13.4 11.6 7" fill="none" stroke="var(--color-surface)" stroke-width="1.1"/>
      </g>
      <circle cx="17.6" cy="16.8" r="2.8" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-registro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5.5v13M5.5 12h13"/>
    </symbol>
    <symbol id="i-revision-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="4" y="4" width="7" height="7" rx="1.6"/>
      <rect x="13" y="4" width="7" height="7" rx="1.6"/>
      <rect x="4" y="13" width="7" height="7" rx="1.6"/>
      <rect x="13" y="13" width="7" height="7" rx="1.6"/>
    </symbol>
    <symbol id="i-revision-lleno" viewBox="0 0 24 24">
      <rect x="4" y="4" width="7" height="7" rx="1.6" fill="currentColor" stroke="none"/>
      <rect x="13" y="4" width="7" height="7" rx="1.6" fill="currentColor" stroke="none"/>
      <rect x="4" y="13" width="7" height="7" rx="1.6" fill="currentColor" stroke="none"/>
      <rect x="13" y="13" width="7" height="7" rx="1.6" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-mimes-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.1 3.6A8.5 8.5 0 1 0 18.4 6.1"/>
      <path d="M12.8 11.4 18.4 6.1A8.5 8.5 0 0 0 12.1 3.6Z"/>
    </symbol>
    <symbol id="i-mimes-lleno" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" fill="currentColor" stroke="none"/>
      <path d="M12.8 11.4 18.4 6.1A8.5 8.5 0 0 0 12.1 3.6Z" fill="var(--color-surface)" stroke="none"/>
    </symbol>
  </svg>

  <header class="cabecera">
    <button class="perfil" type="button" aria-label="Abrir menú de perfil" title="Disponible en un próximo hito">
      <img class="perfil__foto" src="img/perfil.svg" alt="" width="36" height="36">
    </button>
    <div class="cabecera__datos">
      <span class="cabecera__titulo">Kubos</span>
    </div>
  </header>

  <main>
    <section class="resumen" aria-labelledby="total-titulo">
      <h2 class="resumen__titulo" id="total-titulo">Te quedan en total</h2>
      <p class="resumen__cantidad" id="total-mes">175 €</p>
      <p class="resumen__detalle" id="gastado-mes">de 500 € · 325 € gastados este mes</p>
    </section>

    <section aria-labelledby="kubos-titulo">
      <div class="seccion__cabecera">
        <h2 class="seccion__titulo" id="kubos-titulo">Tus kubos</h2>
        <button class="accion" type="button" title="Disponible en un próximo hito">+ Nuevo Kubo</button>
      </div>
      <div id="lista-kubos">
        <!-- El listado se genera en js/main.js a partir de js/datos.js -->
      </div>
    </section>

    <section aria-labelledby="fecha-titulo">
      <div class="seccion__cabecera">
        <h2 class="seccion__titulo" id="fecha-titulo">Kubos con fecha</h2>
        <button class="accion" type="button" title="Disponible en un próximo hito">+ Apartar Kubo</button>
      </div>
      <div id="lista-fecha">
        <!-- Los kubos con fecha se generan en js/main.js a partir de js/datos.js -->
      </div>
    </section>
  </main>

  <nav class="barra-nav" aria-label="Navegación principal">
    <ul class="barra-nav__lista">
      <li>
        <a class="barra-nav__enlace" href="index.html">
          <svg class="barra-nav__icono" aria-hidden="true" focusable="false">
            <use class="icono-linea" href="#i-inicio-linea"></use>
            <use class="icono-lleno" href="#i-inicio-lleno"></use>
          </svg>
          <span>Inicio</span>
        </a>
      </li>
      <li>
        <a class="barra-nav__enlace" href="kubos.html" aria-current="page">
          <svg class="barra-nav__icono" aria-hidden="true" focusable="false">
            <use class="icono-linea" href="#i-kubos-linea"></use>
            <use class="icono-lleno" href="#i-kubos-lleno"></use>
          </svg>
          <span>Kubos</span>
        </a>
      </li>
      <li>
        <a class="barra-nav__enlace barra-nav__enlace--registro" href="registro.html">
          <svg class="barra-nav__icono" aria-hidden="true" focusable="false">
            <use href="#i-registro"></use>
          </svg>
          <span>Registro</span>
        </a>
      </li>
      <li>
        <a class="barra-nav__enlace" href="revision.html">
          <svg class="barra-nav__icono" aria-hidden="true" focusable="false">
            <use class="icono-linea" href="#i-revision-linea"></use>
            <use class="icono-lleno" href="#i-revision-lleno"></use>
          </svg>
          <span>Revisión</span>
        </a>
      </li>
      <li>
        <a class="barra-nav__enlace" href="mi-mes.html">
          <svg class="barra-nav__icono" aria-hidden="true" focusable="false">
            <use class="icono-linea" href="#i-mimes-linea"></use>
            <use class="icono-lleno" href="#i-mimes-lleno"></use>
          </svg>
          <span>Mi mes</span>
        </a>
      </li>
    </ul>
  </nav>
  <script src="js/datos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script></body>
</html>
